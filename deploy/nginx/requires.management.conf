# /etc/nginx/sites-available/requires.management
# Symlink to sites-enabled to activate

server {
    listen 80;
    server_name requires.management;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name requires.management;

    ssl_certificate     /etc/letsencrypt/live/requires.management/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/requires.management/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header X-Content-Type-Options "nosniff"        always;
    add_header Referrer-Policy        "same-origin"    always;
    add_header X-XSS-Protection       "1; mode=block"  always;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
